<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="100%" height="100%" fill="none">
  <defs>
    <!-- Crisp Neon Cyan-to-White Top Half Fill for Custom Vector Letterforms -->
    <linearGradient id="npChromeTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#b8faff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <!-- Cyber Cyan-to-Deep-Blue Bottom Half Fill -->
    <linearGradient id="npChromeBot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>

    <!-- High-Voltage Magenta-to-Gold Accent Slash -->
    <linearGradient id="npOverdriveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff0077" />
      <stop offset="55%" stop-color="#ff2a55" />
      <stop offset="100%" stop-color="#ffe600" />
    </linearGradient>

    <!-- Crest Core Shield Gradient -->
    <linearGradient id="npCrestBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1329" />
      <stop offset="50%" stop-color="#050711" />
      <stop offset="100%" stop-color="#1f051d" />
    </linearGradient>

    <!-- Horizontal Razor Split Clip for Custom Letterforms (Gives authentic 80s/Cyberpunk Mecha Stencil Slice) -->
    <clipPath id="topSlice">
      <rect x="0" y="0" width="860" height="123" />
    </clipPath>
    <clipPath id="botSlice">
      <rect x="0" y="127" width="860" height="173" />
    </clipPath>
  </defs>

  <!-- =========================================================================
       1. BACKGROUND TACTICAL FRAME, REGISTRATION MARKS & SPEED WINGS
       ========================================================================= -->
  <!-- Outer Technical Registration Crosshairs (+) -->
  <g stroke="#00f0ff" stroke-width="1.5" opacity="0.55">
    <path d="M24 22H36M30 16V28" />
    <path d="M824 22H836M830 16V28" />
    <path d="M24 274H36M30 268V280" />
    <path d="M824 274H836M830 268V280" />
  </g>

  <!-- Top Telemetry Spec Rail -->
  <g opacity="0.85">
    <polygon points="245,28 257,16 603,16 615,28 609,28 599,20 261,20 251,28" fill="#00f0ff" opacity="0.5" />
    <rect x="275" y="14" width="36" height="4" fill="#ff0077" />
    <rect x="549" y="14" width="36" height="4" fill="#00f0ff" />
    <text x="430" y="25" text-anchor="middle" fill="#94a3b8" font-family="'Courier New', monospace" font-size="10" font-weight="700" letter-spacing="5">
      SYS.09 // TACTICAL SYNTH-VECTOR // MK-IV
    </text>
  </g>

  <!-- Swept Cyber Wing Brackets Behind Crest & Wordmark -->
  <g opacity="0.9">
    <!-- Left Speed Wing -->
    <polygon points="28,112 115,112 103,124 16,124" fill="#00f0ff" />
    <polygon points="46,130 108,130 98,140 36,140" fill="#ff0077" />
    <polygon points="68,146 104,146 98,152 62,152" fill="#ffe600" />
    <!-- Right Speed Wing -->
    <polygon points="832,112 745,112 757,124 844,124" fill="#00f0ff" />
    <polygon points="814,130 752,130 762,140 824,140" fill="#ff0077" />
    <polygon points="792,146 756,146 762,152 798,152" fill="#ffe600" />
  </g>

  <!-- =========================================================================
       2. LEFT/CENTER INTERCEPTOR MECHA-CREST EMBLEM (X=150, Y=128)
       ========================================================================= -->
  <g transform="translate(152, 128)">
    <!-- Outer Chamfered Octagon Shield -->
    <polygon points="0,-68 48,-48 68,0 48,48 0,68 -48,48 -68,0 -48,-48" fill="url(#npCrestBg)" stroke="#00f0ff" stroke-width="3" />
    <!-- Offset Magenta Glitch Frame -->
    <polygon points="0,-60 42,-42 60,0 42,42 0,60 -42,42 -60,0 -42,-42" fill="none" stroke="#ff0077" stroke-width="1.5" stroke-dasharray="18 8" />

    <!-- Corner Armor Clamps -->
    <path d="M-52,-22 L-62,-12 L-62,12 L-52,22" stroke="#ffe600" stroke-width="2.5" />
    <path d="M52,-22 L62,-12 L62,12 L52,22" stroke="#ffe600" stroke-width="2.5" />

    <!-- High-Voltage Lightning Slash Behind Ship -->
    <polygon points="10,-76 -22,-6 4,-6 -14,76 26,2 -2,2" fill="#ffe600" opacity="0.92" />

    <!-- Valkyrie Mk-IV Cyber-Interceptor Silhouette (Pointing Up-Right) -->
    <g transform="rotate(-35)">
      <!-- Twin Afterburner Plumes -->
      <polygon points="-22,-11 -42,-7 -22,-3" fill="#ff0077" />
      <polygon points="-22,3 -42,7 -22,11" fill="#ff0077" />
      <!-- Forward-Swept Outer Wings -->
      <polygon points="36,0 6,-10 -8,-30 -26,-20 -16,-6 -24,0 -16,6 -26,20 -8,30 6,10" fill="#050814" stroke="#00f0ff" stroke-width="2.6" stroke-linejoin="round" />
      <!-- Inner Plasma Core & Visor -->
      <polygon points="24,0 -4,-8 -12,0 -4,8" fill="#00f0ff" />
      <polygon points="16,0 2,-3.5 -4,0 2,3.5" fill="#ffffff" />
    </g>
  </g>

  <!-- =========================================================================
       3. CUSTOM GEOMETRIC VECTOR WORDMARK: "NEON" (Hand-Cut SVG Polygons)
       ========================================================================= -->
  <!-- Chromatic Magenta Hard-Shadow Layer (Offset +4px X, +4px Y) -->
  <g transform="translate(4, 4)" fill="#ff0077" opacity="0.85">
    <!-- N -->
    <path d="M244,62 L272,62 L316,132 L316,62 L342,62 L342,178 L314,178 L270,108 L270,178 L244,178 Z" />
    <!-- E (with 45-deg mecha chamfer & detached center bar) -->
    <path d="M362,62 L448,62 L436,84 L388,84 L388,109 L434,109 L424,129 L388,129 L388,156 L450,156 L438,178 L362,178 Z" />
    <!-- O (Octagonal Cyber Reactor O with internal vertical slit) -->
    <path fill-rule="evenodd" d="M466,82 L486,62 L548,62 L568,82 L568,158 L548,178 L486,178 L466,158 Z M494,86 L494,154 L540,154 L540,86 Z" />
    <!-- N -->
    <path d="M588,62 L616,62 L660,132 L660,62 L686,62 L686,178 L658,178 L614,108 L614,178 L588,178 Z" />
  </g>

  <!-- Top Half of "NEON" (White-to-Cyan Chrome) -->
  <g clip-path="url(#topSlice)" fill="url(#npChromeTop)">
    <path d="M244,62 L272,62 L316,132 L316,62 L342,62 L342,178 L314,178 L270,108 L270,178 L244,178 Z" />
    <path d="M362,62 L448,62 L436,84 L388,84 L388,109 L434,109 L424,129 L388,129 L388,156 L450,156 L438,178 L362,178 Z" />
    <path fill-rule="evenodd" d="M466,82 L486,62 L548,62 L568,82 L568,158 L548,178 L486,178 L466,158 Z M494,86 L494,154 L540,154 L540,86 Z" />
    <path d="M588,62 L616,62 L660,132 L660,62 L686,62 L686,178 L658,178 L614,108 L614,178 L588,178 Z" />
  </g>

  <!-- Bottom Half of "NEON" (Shifted +2px right for intentional Razor-Slice Katana Cut!) -->
  <g clip-path="url(#botSlice)" transform="translate(2, 0)" fill="url(#npChromeBot)">
    <path d="M244,62 L272,62 L316,132 L316,62 L342,62 L342,178 L314,178 L270,108 L270,178 L244,178 Z" />
    <path d="M362,62 L448,62 L436,84 L388,84 L388,109 L434,109 L424,129 L388,129 L388,156 L450,156 L438,178 L362,178 Z" />
    <path fill-rule="evenodd" d="M466,82 L486,62 L548,62 L568,82 L568,158 L548,178 L486,178 L466,158 Z M494,86 L494,154 L540,154 L540,86 Z" />
    <path d="M588,62 L616,62 L660,132 L660,62 L686,62 L686,178 L658,178 L614,108 L614,178 L588,178 Z" />
  </g>

  <!-- =========================================================================
       4. PRECISION STENCIL SUB-WORDMARK: "P R O T O C O L" (Y=196..226)
       ========================================================================= -->
  <g fill="#e2e8f0">
    <!-- P -->
    <path fill-rule="evenodd" d="M244,192 L280,192 L288,200 L288,210 L280,218 L254,218 L254,230 L244,230 Z M254,200 L254,210 L277,210 L277,200 Z" />
    <!-- R -->
    <path fill-rule="evenodd" d="M304,192 L340,192 L348,200 L348,209 L340,216 L349,230 L337,230 L329,217 L314,217 L314,230 L304,230 Z M314,200 L314,209 L337,209 L337,200 Z" />
    <!-- O -->
    <path fill-rule="evenodd" d="M364,199 L371,192 L401,192 L408,199 L408,223 L401,230 L371,230 L364,223 Z M374,200 L374,222 L398,222 L398,200 Z" />
    <!-- T -->
    <path d="M422,192 L466,192 L466,200 L449,200 L449,230 L439,230 L439,200 L422,200 Z" />
    <!-- O -->
    <path fill-rule="evenodd" d="M480,199 L487,192 L517,192 L524,199 L524,223 L517,230 L487,230 L480,223 Z M490,200 L490,222 L514,222 L514,200 Z" />
    <!-- C -->
    <path d="M540,199 L547,192 L582,192 L576,200 L550,200 L550,222 L576,222 L582,230 L547,230 L540,223 Z" />
    <!-- O -->
    <path fill-rule="evenodd" d="M596,199 L603,192 L633,192 L640,199 L640,223 L633,230 L603,230 L596,223 Z M606,200 L606,222 L630,222 L630,200 Z" />
    <!-- L -->
    <path d="M656,192 L666,192 L666,222 L696,222 L690,230 L656,230 Z" />
  </g>

  <!-- Right-side Industrial Barcode & Kanji Stamp Block next to NEON PROTOCOL -->
  <g transform="translate(706, 64)">
    <rect x="0" y="0" width="96" height="166" fill="#070c1b" stroke="#00f0ff" stroke-width="1.5" opacity="0.85" />
    <rect x="6" y="6" width="84" height="22" fill="#ff0077" />
    <text x="48" y="21" text-anchor="middle" fill="#ffffff" font-family="'Courier New', monospace" font-size="12" font-weight="900" letter-spacing="2">UNIT-01</text>

    <!-- Crisp Vector Barcode Bars -->
    <g fill="#00f0ff" opacity="0.85" transform="translate(10, 36)">
      <rect x="0" y="0" width="4" height="32" />
      <rect x="7" y="0" width="2" height="32" />
      <rect x="12" y="0" width="6" height="32" />
      <rect x="22" y="0" width="2" height="32" />
      <rect x="27" y="0" width="8" height="32" />
      <rect x="38" y="0" width="3" height="32" />
      <rect x="44" y="0" width="2" height="32" />
      <rect x="49" y="0" width="6" height="32" />
      <rect x="59" y="0" width="4" height="32" />
      <rect x="66" y="0" width="2" height="32" />
      <rect x="71" y="0" width="5" height="32" />
    </g>

    <line x1="10" y1="78" x2="86" y2="78" stroke="#334155" stroke-width="1.5" />
    <text x="48" y="98" text-anchor="middle" fill="#ffe600" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" letter-spacing="2">超駆動</text>
    <text x="48" y="114" text-anchor="middle" fill="#94a3b8" font-family="'Courier New', monospace" font-size="8.5" font-weight="700" letter-spacing="1.5">OVERDRIVE</text>

    <!-- Mini Telemetry Status Pips -->
    <rect x="12" y="126" width="16" height="6" fill="#00ff88" />
    <rect x="32" y="126" width="16" height="6" fill="#00f0ff" />
    <rect x="52" y="126" width="16" height="6" fill="#ffe600" />
    <rect x="72" y="126" width="12" height="6" fill="#ff0077" />

    <text x="48" y="152" text-anchor="middle" fill="#00f0ff" font-family="'Courier New', monospace" font-size="9" font-weight="700" letter-spacing="2">REV.2099</text>
  </g>

  <!-- =========================================================================
       5. LOWER HIGH-VOLTAGE "OVERDRIVE" SLANTED HAZARD BANNER (Y=244..284)
       ========================================================================= -->
  <g transform="translate(0, 244)">
    <!-- Skewed Parallelogram Plate -->
    <polygon points="186,0 714,0 698,38 170,38" fill="url(#npOverdriveGrad)" />
    <polygon points="190,3 709,3 695,35 176,35" fill="#060712" />

    <!-- Left & Right Hazard Chevron Stripes -->
    <g fill="#ffe600">
      <polygon points="186,7 200,7 190,31 176,31" />
      <polygon points="206,7 220,7 210,31 196,31" />
      <polygon points="226,7 240,7 230,31 216,31" />

      <polygon points="658,7 672,7 662,31 648,31" />
      <polygon points="678,7 692,7 682,31 668,31" />
    </g>

    <text x="442" y="25" text-anchor="middle" fill="#ffe600" font-family="'Segoe UI', 'Arial Black', sans-serif" font-size="16.5" font-weight="900" font-style="italic" letter-spacing="11">
      OVERDRIVE // SYNTH-ROGUE
    </text>
  </g>
</svg>

